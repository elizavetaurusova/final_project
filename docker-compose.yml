version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: project_seminar_sm_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - project_seminar_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: project_seminar_sm_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@projectseminar.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - project_seminar_network

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_seminar_sm_airflow_webserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - project_seminar_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_seminar_sm_airflow_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
    command: scheduler
    restart: unless-stopped
    networks:
      - project_seminar_network

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_seminar_sm_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    entrypoint: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Seminar --lastname Admin --role Admin --email admin@project_seminar.com --password admin || true"
    restart: on-failure:3
    networks:
      - project_seminar_network

volumes:
  postgres-db-volume:
    name: project_seminar_sm_postgres_data
  pgadmin-data:
    name: project_seminar_sm_pgadmin_data

networks:
  project_seminar_network:
    name: project_seminar_network
    driver: bridge